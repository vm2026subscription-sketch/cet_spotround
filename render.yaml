services:
  - type: web
    name: cap-portal-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # "/" returns the API banner, so Render can use it to tell the service is up.
    healthCheckPath: /
    envVars:
      # sync: false = Render prompts for the value instead of storing it in git.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_VERSION
        value: "24"
